<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dynamic Charts Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: graph-paper study desk — sticky left nav of sections, one section on screen at a time; inside each, chart pinned left while sentence tasks scroll right. Light only (teacher's preference). */
:root{
  --paper:#f6f8fb; --grid:#e3e9f2; --card:#ffffff; --ink:#18233a; --muted:#5a6681; --line:#d5dce8;
  --navy:#1f3a68; --red:#c8323c; --teal:#14806f; --amber:#b9790a; --violet:#6a4bb0;
  --ok:#14806f; --okbg:#e3f4ef; --bad:#b4313a; --badbg:#fbe9ea; --tip:#fff6dc;
  --f-head:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.2}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.top .sub{font-size:13px;opacity:.75}
.prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.bar{width:min(260px,40vw);height:9px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7fd6c2;transition:width .4s}
.prog b{font-family:var(--f-mono);font-size:14px}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.iconbtn svg{width:16px;height:16px}
.navtoggle{display:none}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto}
nav.side{width:100%;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.side .grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
.side a:hover{background:var(--paper)}
.side a.on{background:var(--navy);color:#fff}
.side a .code{font-family:var(--f-mono);font-size:12px;min-width:30px;text-align:center;padding:1px 4px;border-radius:5px;background:var(--grid);color:var(--navy)}
.side a.on .code{background:rgba(255,255,255,.2);color:#fff}
.side a .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.side a.on .cnt{color:#cfe0ff}
.side a .cnt.full{color:var(--ok);font-weight:600}
.side a.on .cnt.full{color:#7fd6c2}

main{min-width:0}
section.view{display:none}
section.view.on{display:block}
.shead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.shead .tag{font-family:var(--f-mono);background:var(--red);color:#fff;padding:4px 10px;border-radius:6px;font-size:15px}
.shead h2{font-size:clamp(24px,3vw,32px);color:var(--navy)}
.shead p{margin:0;color:var(--muted);width:100%}

.theory{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-bottom:22px}
.theory>div{min-width:0}
.theory h3{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:17px;margin:4px 0 12px}
.formula span{padding:4px 10px;border-radius:7px;border:1.5px solid;font-weight:600}
.k-s{border-color:var(--navy);color:var(--navy);background:#eaf0fa}
.k-v{border-color:var(--red);color:var(--red);background:#fcecee}
.k-n{border-color:var(--teal);color:var(--teal);background:#e3f4ef}
.k-t{border-color:var(--amber);color:#8a5a00;background:#fff3d6}
.k-x{border-color:var(--violet);color:var(--violet);background:#efeafa}
.ex{border-left:4px solid var(--navy);background:var(--paper);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.ex em{font-style:normal;color:var(--red);font-weight:600}
.note{background:var(--tip);border:1px solid #f0dca0;border-radius:10px;padding:10px 14px;font-size:15.5px;margin-top:10px}
.note b{color:#7a5300}
.wrongright{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15.5px;margin-top:6px}
.wrongright .x{color:var(--bad);font-weight:700}.wrongright .o{color:var(--ok);font-weight:700}
.wrongright s{color:var(--bad)}
table.vt{border-collapse:collapse;font-size:15.5px;width:100%}
table.vt td,table.vt th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.vt th{background:var(--paper);font-weight:600}

.block{margin-bottom:26px}
.blabel{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.blabel h3{font-size:20px;color:var(--ink)}
.blabel .src{font-size:13.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.chartcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.prompt{font-weight:600;font-size:15.5px;margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:2px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:10px}
.chartbox{overflow-x:auto}
.chartcard,.card{min-width:0}
.chartbox svg{display:block;width:100%;height:auto;min-width:420px}
.chartfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.linkbtn{background:none;border:none;color:var(--navy);text-decoration:underline;padding:0;font-size:13.5px}
.datatable{overflow-x:auto;margin-top:6px}
.datatable table{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;width:100%}
.datatable td,.datatable th{border:1px solid var(--line);padding:3px 6px;text-align:right}
.datatable th:first-child,.datatable td:first-child{text-align:left;font-family:var(--f-body)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:5px 8px;border-radius:6px;z-index:50;font-family:var(--f-mono);display:none}

.tasks{display:flex;flex-direction:column;gap:14px;min-width:0}
.task{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;transition:border-color .2s,box-shadow .2s}
.task.focus{border-color:var(--navy);box-shadow:0 0 0 3px #dce6f7}
.task.done{border-color:var(--ok)}
.thead{display:flex;gap:10px;align-items:flex-start}
.thead .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.task.done .thead .n{background:var(--ok)}
.cue{margin:0;font-size:16.5px;flex:1;min-width:0}
.cue b{color:var(--red)}
.cue .use{display:inline-block;font-size:13px;background:#efeafa;color:var(--violet);border-radius:5px;padding:0 6px;font-weight:600;margin-left:4px}
textarea{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:17px;resize:vertical;min-height:72px;background:#fbfcfe;color:var(--ink)}
textarea:focus{border-color:var(--navy);background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:15px}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.soft{background:#fff;color:var(--muted);border-color:var(--line)}
.fb{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:15px}
.fb li{display:flex;gap:8px;align-items:flex-start;padding:5px 9px;border-radius:7px}
.fb li.ok{background:var(--okbg);color:#0d5a4d}
.fb li.no{background:var(--badbg);color:#8c2129}
.fb li.err{background:var(--tip);color:#6b4a00}
.fb li svg{flex:none;width:16px;height:16px;margin-top:3px}
.fb li.sum{font-weight:600}
.hintbox,.modelbox{margin-top:10px;border-radius:9px;padding:10px 12px;font-size:15.5px}
.hintbox{background:var(--tip);border:1px dashed #e2c46e}
.modelbox{background:#eef3fb;border:1px solid #c9d6ee}
.modelbox p{margin:4px 0}
.modelbox .lab{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.pager button{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left;min-width:0;max-width:48%}
.pager button small{display:block;color:var(--muted);font-size:12.5px}
.pager button.nx{margin-left:auto;text-align:right;border-color:var(--navy)}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.intro>div{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{margin:6px 0}
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.map a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14.5px;background:var(--paper)}
.map a b{font-family:var(--f-mono);color:var(--red);margin-right:6px}

/* sample */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.essay{font-size:17.5px;line-height:1.85;max-width:78ch}
.essay p{margin:0 0 14px}
.essay mark{background:transparent;color:inherit;border-radius:4px;padding:1px 2px;transition:background .2s}
.essay.h-s1 mark.s1{background:#dbe5f7;box-shadow:inset 0 -2px var(--navy)}
.essay.h-s2 mark.s2{background:#d5efe9;box-shadow:inset 0 -2px var(--teal)}
.essay.h-nom mark.nom{background:#efe7fb;box-shadow:inset 0 -2px var(--violet)}
.essay.h-cmp mark.cmp{background:#fff0cc;box-shadow:inset 0 -2px var(--amber)}
.essay.h-peak mark.peak{background:#fde0e2;box-shadow:inset 0 -2px var(--red)}
.essay.h-before mark.before{background:#ffe4cf;box-shadow:inset 0 -2px #c25b12}
.essay.h-link mark.link{background:#e6e9ee;box-shadow:inset 0 -2px var(--muted)}
.qa{margin-top:14px}
.qa details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.qa summary{cursor:pointer;font-weight:600}

/* final */
.meter{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meter span{font-size:14px;border-radius:999px;padding:4px 11px;border:1.5px solid var(--line);color:var(--muted);background:#fff}
.meter span.hit{border-color:var(--ok);color:#0d5a4d;background:var(--okbg);font-weight:600}
.stat{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}

.minitable{border-collapse:collapse;font-size:15px;margin-top:8px}
.minitable td,.minitable th{border:1px solid var(--line);padding:4px 10px;font-family:var(--f-mono)}
.minitable th{background:var(--paper);font-family:var(--f-body)}

.disclaim{font-size:13px;color:var(--muted);margin-top:24px}

/* gửi bài */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,25,45,.55);display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:14px;padding:22px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h2{font-size:22px;color:var(--navy);margin-bottom:6px}
.mbox p{margin:0;color:var(--muted);font-size:15px}
.mbox label{display:block;font-weight:600;font-size:15px;margin-top:14px}
.mbox input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:17px;color:var(--ink);background:#fbfcfe}
.mbox input:focus{outline:none;border-color:var(--navy);background:#fff}
.merr{color:var(--bad)!important;min-height:1.3em;font-size:14px!important;margin:10px 0 6px!important}
.mbox .btn{width:100%;padding:11px;font-size:16px}
.iconbtn.go{background:#7fd6c2;color:#0d3a33;border-color:#7fd6c2;font-weight:700}
.syncTxt{font-size:12.5px;opacity:.85;white-space:nowrap}
.syncTxt.err{color:#ffd2d5;opacity:1}
@media (max-width:860px){.syncTxt{display:none}}

@media (max-width:1100px){
  .pair{grid-template-columns:minmax(0,1fr)}
  .chartcard{position:relative;top:auto}
  .theory,.intro{grid-template-columns:1fr}
}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);max-height:none;z-index:40;border-radius:0;transform:translateX(-105%);transition:transform .25s;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(10px,env(safe-area-inset-left,0px))}
  nav.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,20,40,.35)}
  .navtoggle{display:inline-flex}
  .top .sub{display:none}
  .pager button{max-width:100%;width:100%}
  .map{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <button class="iconbtn navtoggle" id="navBtn" aria-label="Mở danh sách bài"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Bài học</button>
  <div><h1>Writing Task 1 · Dynamic Charts Revision</h1><div class="sub">Tự ôn các cấu trúc câu mô tả biểu đồ động</div></div>
  <div class="prog">
    <div class="bar"><i id="progBar"></i></div><b id="progTxt">0/0</b>
    <span class="syncTxt" id="syncTxt"></span>
    <button class="iconbtn" id="meBtn" aria-label="Đổi tên học sinh"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5" r="3"/><path d="M2 14.5c.6-3 3-4.5 6-4.5s5.4 1.5 6 4.5z"/></svg><span id="meLbl">Học sinh</span></button>
    <button class="iconbtn go" id="submitBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8l12-5-5 12-2-5z"/></svg>Nộp bài</button>
    <button class="iconbtn" id="sndBtn" aria-pressed="true" aria-label="Bật/tắt âm thanh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="sndWave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/></svg><span id="sndLbl">Âm thanh</span></button>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Các phần"></nav>
  <main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<div class="modal" id="who" hidden><div class="mbox" role="dialog" aria-labelledby="whoH">
  <h2 id="whoH">Thông tin học sinh</h2><p>Nhập đúng họ tên và lớp để thầy nhận được bài làm.</p>
  <label>Họ và tên<input id="whoName" autocomplete="name"></label>
  <label>Lớp<input id="whoCls"></label>
  <p class="merr" id="whoErr"></p>
  <button class="btn" id="whoOk">Bắt đầu</button>
</div></div>

<script>
/* ============ DATA ============ */
const COLORS=['#1f3a68','#c8323c','#14806f','#b9790a'];
const DASH=['', '7 5', '2 4', '10 4 2 4'];

const CHARTS={
 aus:{type:'line',title:'Australian exports to 4 countries',prompt:'The graph below shows the percentage of Australian exports to 4 countries from 1990 to 2012.',
  unit:'%',x:[1990,1995,2000,2005,2010,2012],yMax:30,yStep:5,yLabel:'%',src:'Biểu đồ trong phiếu học',
  series:[{n:'Japan',d:[26,20,19,19,17,17]},{n:'US',d:[11,8,11,8,5,7]},{n:'China',d:[2,3,5,12.5,25,27]},{n:'India',d:[1,1,1,5,7,5]}]},
 asia:{type:'line',title:'Urban population in four Asian countries',prompt:'The graph below gives information about the percentage of the population in four Asian countries living in cities from 1970 to 2020, with predictions for 2030 and 2040.',
  unit:'%',x:[1970,1980,1990,2000,2010,2020,2030,2040],proj:6,yMax:90,yStep:10,yLabel:'%',src:'Đề forecast 2026 (Cambridge 18 Test 1)',
  series:[{n:'Malaysia',d:[34,42,50,62,71,77,82,85]},{n:'Philippines',d:[33,38,48,48,46,49,57,65]},{n:'Thailand',d:[20,23,27,30,34,38,42,45]},{n:'Indonesia',d:[15,18,24,33,40,52,60,65]}]},
 aged:{type:'line',title:'Population aged 65 and over',prompt:'The graph below shows the proportion of the population aged 65 and over between 1940 and 2040 in three different countries.',
  unit:'%',x:[1940,1960,1980,2000,2010,2020,2030,2040],proj:6,yMax:30,yStep:5,yLabel:'%',src:'Đề forecast 2026',
  series:[{n:'USA',d:[9,10,15,14,14,15,19,23]},{n:'Sweden',d:[7,10,13,17,20,18,21,25]},{n:'Japan',d:[5,4,3,7,10,14,20,27]}]},
 visit:{type:'line',title:'Overseas visitors to the UK by purpose of visit',prompt:'The line graph shows the number of overseas visitors who came to the UK for different purposes between 1989 and 2009.',
  unit:' million',x:[1989,1994,1999,2004,2009],yMax:10,yStep:2,yLabel:'millions',src:'Đề forecast 2026',
  series:[{n:'Holiday',d:[6.5,7.5,9.5,7.5,8.8]},{n:'Business',d:[5.5,4,6,7,8]},{n:'Visiting friends & relatives',d:[3.5,4.2,5,6.8,6.2]}]},
 crime:{type:'line',title:'Crime in Newport city centre',prompt:'The chart below shows the changes that took place in three areas of crime in Newport city centre from 2003 to 2012.',
  unit:' cases',x:[2003,2004,2006,2008,2010,2012],yMax:4000,yStep:1000,yLabel:'cases',src:'Đề forecast 2026',
  series:[{n:'Burglary',d:[3400,3600,2300,1400,1100,1300]},{n:'Car theft',d:[3800,3500,2700,2200,2400,2000]},{n:'Robbery',d:[800,600,700,1000,1100,1400]}]},
 japan:{type:'bar',title:"Japan's population by age group",prompt:"The chart below shows Japan's population by age groups starting in 1960 and including a forecast to 2040.",
  unit:'%',x:[1960,1980,2000,2020,2040],proj:4,yMax:80,yStep:10,yLabel:'% of population',src:'Đề forecast 2026',

/* regex helpers */
const N=s=>new RegExp('(?<![\\d.])'+s.replace(/\./g,'\\.')+'(?![\\d])');
const UP=/\b(rose|risen|rise|rising|increased?|increasing|grew|grown|grow|growing|climbed?|climbing|surged?|surging|soared?|soaring|rocketed|jumped|went up|recovered|rebounded)\b/;
const DOWN=/\b(fell|fallen|fall|falling|declined?|declining|decreased?|decreasing|dropped|drop|dropping|dipped|dip|plummeted|plunged|went down|shrank)\b/;
const FLAT=/\b(remained|remain|stayed|stay|levelled|leveled|level(l)?ed off|stable|unchanged|constant|plateaued|steady)\b/;
const R=(label,re)=>({label,re});

/* sections */
const S=[];
S.push({id:'start',code:'0',grp:'Bắt đầu',name:'Cách học trang này',kind:'intro'});

S.push({id:'c1',code:'C1',grp:'c. Cấu trúc cần dùng',name:'Đối tượng làm chủ ngữ',

 formula:[['k-s','Đối tượng'],['k-v','V xu hướng'],['k-x','(adv)'],['k-n','from … to / to + số'],['k-t','mốc thời gian']],

  {cue:'Mô tả <b>China</b> từ 1990 đến 2000 (đoạn tăng chậm).',stem:"By 2000, China's imports ",hl:[[2,0,2]],
   reqs:[R('Có động từ tăng (rose, increased, climbed…)',UP),R('Có số liệu 5%',N('5'))],
   hint:'Tăng chậm, đều: rose steadily / increased gradually.',models:["By 2000, China's imports had risen gradually to 5%."]},
  {cue:'Mô tả <b>China</b> 10 năm tiếp theo (2000 → 2010), đoạn tăng vọt.',stem:'After 10 years, ',hl:[[2,2,4]],
   reqs:[R('Chủ ngữ là China / China\'s imports / they',/after (10|ten) years,?\s*(china|they|its|the chinese)/),R('Có động từ tăng mạnh (surged, soared, rose sharply…)',/(surged|soared|rocketed|(rose|increased|grew|climbed)\s+(sharply|dramatically|significantly|considerably|rapidly|substantially))/),R('Có số liệu 25%',N('25'))],
   hint:'Tăng rất mạnh: surged / soared / rose dramatically.',models:["After 10 years, China's imports surged to 25% in 2010.","After 10 years, they rose dramatically to a quarter of all exports (25%)."]},
  {cue:'Mô tả <b>Japan</b> giai đoạn 1990 → 1995.',stem:'Japan ',hl:[[0,0,1]],
   reqs:[R('Có động từ giảm',DOWN),R('Có 26%',N('26')),R('Có 20%',N('20'))],
   hint:'from … to … : fell from 26% to 20%.',models:['Japan fell sharply from 26% to 20% between 1990 and 1995.']}
 ],
 fc:'asia',
 tasks:[
  {cue:'<b>Malaysia</b> từ 1970 đến 2000.',hl:[[0,0,3]],
   reqs:[R('Câu bắt đầu bằng Malaysia (đối tượng làm chủ ngữ)',/^(malaysia|the urban population of malaysia|malaysia's)/),R('Có động từ tăng',UP),R('Có 34%',N('34')),R('Có 62%',N('62'))],
   hint:'Malaysia + rose steadily + from …% in 1970 + to …% in 2000.',models:["Malaysia's urban population rose steadily from 34% in 1970 to 62% in 2000."]},
  {cue:'<b>The Philippines</b> từ 1990 đến 2010 (gần như đi ngang).',hl:[[1,2,4]],
   reqs:[R('Câu bắt đầu bằng The Philippines',/^(the philippines|philippines)/),R('Có từ chỉ ổn định (remained, stayed, levelled off…)',FLAT),R('Có số liệu khoảng 46–48%',/(?<![\d.])4[678](?![\d])/)],
   hint:'remained relatively stable at around …%',models:['The Philippines remained relatively stable at around 47% between 1990 and 2010.']},
  {cue:'<b>Thailand</b> 2020 → 2040 (năm dự đoán).',hl:[[2,5,7]],
   reqs:[R('Câu bắt đầu bằng Thailand',/^thailand/),R('Dùng thì tương lai / dự đoán (is expected to, is predicted to, will…)',/(is|are)\s+(expected|predicted|projected|forecast|set)\s+to|\bwill\b/),R('Có 45%',N('45'))],
   hint:'Thailand is predicted to rise to …% by 2040.',models:['Thailand is predicted to rise gradually from 38% in 2020 to 45% by 2040.']}
 ]});

/* common error detector */
const ERRS=[
 [/\b(was|were|is|are|been|be)\s+(increased|decreased|risen|rose|fell|fallen|declined|dropped|grown|grew|climbed|surged|soared|fluctuated|plummeted)\b/,'Động từ xu hướng (increase, rise, fall…) không dùng bị động: viết "increased", không viết "was increased".'],
 [/\breach(ed|es|ing)?\s+at\b/,'"reach" không đi với "at": reached 6 million. ("peaked at" thì đúng.)'],
 [/\bmore\s+(higher|lower|bigger|smaller|larger|greater)\b/,'Không dùng "more" với tính từ -er: viết "higher", không viết "more higher".'],
 [/\bbefore\s+(rose|fell|increased|decreased|declined|dropped|reached|surged|soared|climbed|grew|dipped|recovered|peaked|rise|fall|increase|decrease|reach|drop|climb|surge)\b/,'Sau "before" dùng V-ing: before rising / before falling.'],

 [/\bhaving\s+(rose|fell|grew|rise|fall|grow|reach|peak|increase|decrease|drop|decline|climb)\b/,'Sau "having" dùng V3: having risen / fallen / grown / reached / peaked.'],

let actx=null;
function tone(freqs,dur=0.18,type='sine',gap=0.09,vol=0.18){
 if(!sound)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const t0=actx.currentTime;
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
   const s=t0+i*gap;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+0.01);g.gain.exponentialRampToValueAtTime(0.0008,s+dur+0.25);
   o.connect(g).connect(actx.destination);o.start(s);o.stop(s+dur+0.3)});
 }catch(e){}
}

const tip=document.getElementById('tip');
function fmt(v,c){return (v>=1000?v.toLocaleString('en-US'):v)+(c.unit==='%'?'%':'')}
function chartSVG(c,hl){
 const W=640,H=370,L=62,Rr=16,T=22,B=40,iw=W-L-Rr,ih=H-T-B;
 const n=c.x.length,y=v=>T+ih-(v/c.yMax)*ih;
 let xs;
 if(c.type==='bar'){const bw=iw/n;xs=i=>L+bw*i+bw/2}
 else{const x0=c.x[0],x1=c.x[n-1];xs=i=>L+((c.x[i]-x0)/(x1-x0))*(iw-30)+15}
 const hlOn=hl&&hl.length, inHL=(s,i)=>hlOn&&hl.some(h=>h[0]===s&&i>=h[1]&&i<=h[2]);
 const sHL=s=>hlOn&&hl.some(h=>h[0]===s);
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}">`;
 if(c.proj!=null){const px=c.type==='bar'?L+iw/n*c.proj:(xs(c.proj-1)+xs(c.proj))/2;
  o+=`<rect x="${px}" y="${T}" width="${L+iw-px}" height="${ih}" fill="#eef1f6"/><text x="${L+iw-6}" y="${T+14}" text-anchor="end" font-size="14" fill="#5a6681" font-family="Be Vietnam Pro">Dự đoán</text>`}
 for(let v=0;v<=c.yMax+1e-9;v+=c.yStep){o+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#dfe5ee" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="15" fill="#5a6681" font-family="IBM Plex Mono">${v>=1000?v.toLocaleString('en-US'):v}</text>`}
 o+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ih}" stroke="#18233a"/><line x1="${L}" x2="${L+iw}" y1="${T+ih}" y2="${T+ih}" stroke="#18233a"/>`;
 c.x.forEach((xv,i)=>{o+=`<text x="${xs(i)}" y="${T+ih+20}" text-anchor="middle" font-size="15" fill="#18233a" font-family="IBM Plex Mono">${xv}</text>`});
 o+=`<text x="14" y="${T+ih/2}" transform="rotate(-90 14 ${T+ih/2})" text-anchor="middle" font-size="14" fill="#5a6681" font-family="Be Vietnam Pro">${c.yLabel}</text>`;
 const labels=[];
 if(c.type==='bar'){
  const bw=iw/n,ns=c.series.length,gw=bw*0.74,b1=gw/ns;
  c.series.forEach((s,si)=>s.d.forEach((v,i)=>{
   const x=L+bw*i+(bw-gw)/2+b1*si,h=T+ih-y(v),op=hlOn?(inHL(si,i)?1:0.22):1;
   o+=`<rect class="pt" data-s="${si}" data-i="${i}" x="${x+1}" y="${y(v)}" width="${b1-2}" height="${h}" fill="${COLORS[si]}" opacity="${op}" ${si===2?'':''}/>`;
   if(inHL(si,i))labels.push([x+b1/2,y(v)-6,fmt(v,c),COLORS[si]]);
  }));
 }else{
  c.series.forEach((s,si)=>{
   const pts=s.d.map((v,i)=>[xs(i),y(v)]);
   const op=hlOn?(sHL(si)?0.45:0.18):1;
   o+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${COLORS[si]}" stroke-width="2.4" stroke-dasharray="${DASH[si]}" opacity="${op}" stroke-linejoin="round"/>`;
   if(hlOn)hl.filter(h=>h[0]===si).forEach(h=>{
    const seg=pts.slice(h[1],h[2]+1);
    if(seg.length>1)o+=`<polyline points="${seg.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${COLORS[si]}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
   });
   pts.forEach((p,i)=>{const on=inHL(si,i);
    o+=`<circle class="pt" data-s="${si}" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="${on?6:4}" fill="${on?COLORS[si]:'#fff'}" stroke="${COLORS[si]}" stroke-width="2" opacity="${hlOn&&!sHL(si)?0.25:1}"/>`;
    if(on)labels.push([p[0],p[1]-11,fmt(s.d[i],c),COLORS[si]]);
   });
  });
 }
 labels.forEach(l=>{const w=String(l[2]).length*9.4+12;
  o+=`<g><rect x="${l[0]-w/2}" y="${l[1]-18}" width="${w}" height="23" rx="4" fill="#ffffff" stroke="${l[3]}" stroke-width="1.5"/><text x="${l[0]}" y="${l[1]-1}" text-anchor="middle" font-size="15" font-weight="600" fill="${l[3]}" font-family="IBM Plex Mono">${l[2]}</text></g>`});
 return o+'</svg>';
}

  h+=`<div class="shead"><span class="tag">${s.code}</span><h2>${s.name}</h2><p>${s.sub}</p></div>`+theoryHTML(s);
  if(s.aus)h+=pairHTML('Bài 1 · Biểu đồ trong phiếu','Australian exports to 4 countries','aus',s.aus,`${s.id}-a`);
  h+=pairHTML(s.aus?'Bài 2 · Luyện với đề forecast':'Luyện với đề forecast',CHARTS[s.fc].title,s.fc,s.tasks,`${s.id}-f`);
 }
 const prev=S[idx-1],next=S[idx+1];
 h+=`<div class="pager">${prev?`<button data-go="${prev.id}"><small>Bài trước</small>${prev.code} · ${prev.name}</button>`:''}${next?`<button class="nx" data-go="${next.id}"><small>Bài tiếp</small>${next.code} · ${next.name}</button>`:''}</div>`;
 if(s.kind!=='intro')h+=`<p class="disclaim">Các biểu đồ forecast được vẽ lại từ đề dự đoán 2026 với số liệu gần đúng để luyện câu. Khi làm đề thật, con đọc số trên biểu đồ gốc.</p>`;
 return h+'</section>';
}
function render(){main.innerHTML=S.map(renderSection).join('');renderNav();refreshProgress()}

function refreshProgress(){
 const all=S.flatMap(sectionTasks),d=all.filter(i=>store.done[i]).length;
 document.getElementById('progBar').style.width=(all.length?d/all.length*100:0)+'%';
 document.getElementById('progTxt').textContent=d+'/'+all.length;
 const cur=location.hash.slice(1);renderNav();markNav(cur||'start');
 if(d===all.length&&all.length&&!store.won){store.won=1;save();win()}
}
function markNav(id){side.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===id))}
function show(id){
 if(!S.some(s=>s.id===id))id='start';
 document.querySelectorAll('section.view').forEach(v=>v.classList.toggle('on',v.dataset.id===id));
 markNav(id);side.classList.remove('open');window.scrollTo({top:0});
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(b&&b.dataset.act){const task=b.closest('.task'),id=task.id;
  if(b.dataset.act==='check')runCheck(id);
  if(b.dataset.act==='hint'){const h=task.querySelector('.hintbox');h.hidden=!h.hidden}
  if(b.dataset.act==='model'){const m=task.querySelector('.modelbox');m.hidden=!m.hidden}
  focusTask(task);return}
 if(b&&b.dataset.go){location.hash=b.dataset.go;return}
 if(b&&b.dataset.tbl){const card=document.getElementById(b.dataset.tbl),t=card.querySelector('.datatable');t.hidden=!t.hidden;b.textContent=t.hidden?'Hiện bảng số liệu':'Ẩn bảng số liệu';return}
 if(b&&b.classList.contains('chip')){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);document.getElementById('essay').classList.toggle('h-'+b.dataset.k,on);if(on)tone([880],0.08,'sine',0,0.08);return}
 if(b&&b.id==='finalCheck'){finalCheck();return}
 if(b&&b.id==='finalModel'){const m=document.getElementById('fmodel');m.hidden=!m.hidden;return}
 if(b&&b.id==='navBtn'){side.classList.toggle('open');return}
 if(b&&b.id==='sndBtn'){sound=!sound;store.sound=sound;save();b.setAttribute('aria-pressed',sound);document.getElementById('sndLbl').textContent=sound?'Âm thanh':'Tắt tiếng';document.getElementById('sndWave').style.display=sound?'':'none';if(sound)ting();return}
 const t=e.target.closest('.task');if(t)focusTask(t);
 if(side.classList.contains('open')&&!e.target.closest('nav.side'))side.classList.remove('open');
});
function focusTask(task){
 const t=TASKS[task.id];task.closest('section').querySelectorAll('.task.focus').forEach(x=>x.classList.remove('focus'));task.classList.add('focus');
 const block=task.closest('.pair');if(!block||!t.hl)return;const card=block.querySelector('.chartcard');if(card)setHL(card,t.hl);
}
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.task');if(t)focusTask(t)});
let saveT=null;
document.addEventListener('input',e=>{
 if(e.target.tagName!=='TEXTAREA')return;const id=e.target.id.replace(/^ta-/,'');store.draft[id]=e.target.value;clearTimeout(saveT);saveT=setTimeout(save,400);
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){const t=e.target.closest('.task');if(t){e.preventDefault();runCheck(t.id)}}});
document.addEventListener('mousemove',e=>{
 const p=e.target.closest&&e.target.closest('.pt');
 if(!p){tip.style.display='none';return}
 const c=CHARTS[p.closest('.chartcard').dataset.chart],s=c.series[+p.dataset.s];
 tip.textContent=`${s.n} · ${c.x[+p.dataset.i]}: ${fmt(s.d[+p.dataset.i],c)}${c.unit!=='%'?c.unit.replace(' cases',' cases'):''}`.replace(/(\d)( million)( million)/,'$1$2');
 tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-30)+'px';
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

/* final challenge */
const FINAL=[
 ['C1 Đối tượng làm chủ ngữ',/(^|[.]\s*)(malaysia|the philippines|philippines)('s)?\b[^.]*\b(rose|increased|grew|climbed|remained|stayed|fell|dipped|surged|is (expected|predicted|projected))/],
 ['C2 The figure / percentage …',/\bthe (figure|percentage|proportion|share|number) (for|of)\b/],
 ['C3 Thời gian làm chủ ngữ',/\b(19|20)\d0s? (witnessed|saw)\b|\bthe (year|period|decade) [^.]{0,20}(witnessed|saw)\b|\b(19|20)\d\d (witnessed|saw)\b/],
 ['C4 Lượng thay đổi làm chủ ngữ',/\ban? (\w+ )?(increase|decrease|rise|fall|drop|decline) of [^.]*was (recorded|seen|witnessed)/],
 ['C5 Danh từ hoá',/\bthere (was|were|is|will be|is expected to be|is predicted to be) an? (\w+ )?(increase|decrease|rise|fall|drop|decline|growth)|\bexperienced an? (\w+ )?(increase|decrease|rise|fall)/],
 ['So sánh',/\bthan\b|respectively|surpass|overt(ook|ake)|whereas|while|by contrast|in contrast/],
 ['Đỉnh / đáy',/peak|bottomed out|a low of|highest|lowest/],
 ['before + V-ing',/before \w+ing\b/],
 ['followed by',/followed by/],
 ['having + V3',/having (\w+ed|risen|fallen|grown|reached|hit)\b/]
];
function finalCheck(){
 const ta=document.getElementById('ta-final'),txt=norm(ta.value),m=document.getElementById('meter');
 if(!txt){document.getElementById('fstat').textContent='Con chưa viết gì.';soft();return}
 let hits=0;m.innerHTML=FINAL.map(f=>{const h=f[1].test(txt);if(h)hits++;return `<span class="${h?'hit':''}">${f[0]}</span>`}).join('');
 const words=txt.split(/\s+/).filter(Boolean).length,nums=(txt.match(/\d+(\.\d+)?%?/g)||[]).length;
 document.getElementById('fstat').textContent=`${words} từ · ${nums} số liệu · ${hits}/${FINAL.length} cấu trúc`;
 const errs=ERRS.filter(e=>e[0].test(txt)),fb=document.getElementById('ffb');
 logFinal(ta.value,FINAL.filter(f=>f[1].test(txt)).map(f=>f[0]),words,errs);
 fb.hidden=false;
 fb.innerHTML=`<li class="sum ${hits>=4&&!errs.length?'ok':'no'}">${hits>=4&&!errs.length?ICON_OK:ICON_NO}<span>${hits>=4?(errs.length?'Đủ cấu trúc rồi, sửa nốt lỗi bên dưới nhé.':'Đạt thử thách! Con đã dùng từ 4 cấu trúc trở lên.'):`Con mới dùng ${hits} cấu trúc. Cần ít nhất 4.`}</span></li>`+errs.map(e=>`<li class="err">${ICON_WARN}<span>${e[1]}</span></li>`).join('');
 if(hits>=4&&!errs.length){if(!store.done.final){store.done.final=1;save();refreshProgress()}win()}else soft();
}
/* final counts as a task */
const _st=sectionTasks;sectionTasks=function(s){return s.kind==='final'?['final']:_st(s)};

/* ============ GỬI BÀI VỀ GOOGLE SHEET ============ */
const SHEET_URL='https://script.google.com/macros/s/AKfycbzmY4g3lau092LGoVA3ApYgafgeYyfPbjYNwhbTddBEaZp8hFWUS7QD-b4R29eutlRg/exec';   // link .../exec của Apps Script
const PAGE_NAME='WT1 · Dynamic Charts Revision';
store.res=store.res||{};
let pendingChecks=[],syncT=null;
const stripTags=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const secName=s=>s.code+' · '+s.name;
function secOf(id){return S.find(s=>sectionTasks(s).includes(id))}
function setSync(msg,cls){const el=document.getElementById('syncTxt');el.textContent=msg;el.className='syncTxt'+(cls?' '+cls:'')}
function logResult(id,t,raw,ok,errs,all){
 const r=store.res[id]||{tries:0};
 r.tries++;r.text=raw.trim();r.ok=ok;r.total=t.reqs.length;r.errs=errs.map(e=>e[1]);r.pass=all;
 store.res[id]=r;save();
 const s=secOf(id);
 pendingChecks.push({id,at:Date.now(),sec:s?secName(s):'',cue:stripTags(t.cue),text:r.text,ok,total:r.total,pass:all,errs:r.errs});
 queueSync();
}
function logFinal(text,hits,words,errs){
 store.finalRes={text:text.trim(),hits,words,errs:errs.map(e=>e[1])};save();
 pendingChecks.push({id:'final',at:Date.now(),sec:'★ Thử thách',cue:'Đoạn thân bài Malaysia & the Philippines',text:text.trim(),ok:hits.length,total:FINAL.length,pass:hits.length>=4&&!errs.length,errs:store.finalRes.errs});
 queueSync();
}
function buildPayload(event){
 const items=[];
 S.forEach(s=>{if(s.kind==='final')return;
  sectionTasks(s).forEach(id=>{const t=TASKS[id];if(!t)return;const r=store.res[id]||{};
   items.push({id,sec:secName(s),cue:stripTags(t.cue),text:r.text||'',pass:!!store.done[id],ok:r.ok||0,total:t.reqs.length,tries:r.tries||0,errs:r.errs||[]})})});
 const all=S.flatMap(sectionTasks),done=all.filter(i=>store.done[i]).length;
 const st=store.student;
 return {sid:st.sid,name:st.name,cls:st.cls,page:PAGE_NAME,event,done,total:all.length,final:store.finalRes||null,items,checks:pendingChecks.splice(0)};
}
function linkOK(){return /^https:\/\/script\.google\.com\//.test(SHEET_URL)}
function sendNow(event){
 clearTimeout(syncT);
 if(!store.student)return Promise.resolve(false);
 if(!linkOK()){setSync('Chưa gắn link Sheet','err');return Promise.resolve(false)}
 const p=buildPayload(event);
 setSync('Đang lưu…');
 return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
  .then(()=>{setSync('Đã lưu '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),'');return true})
  .catch(()=>{pendingChecks=p.checks.concat(pendingChecks);setSync('Mất mạng, sẽ gửi lại','err');queueSync(15000);return false});
}
function queueSync(ms){clearTimeout(syncT);syncT=setTimeout(()=>sendNow('check'),ms||2500)}
window.addEventListener('pagehide',()=>{
 if(!pendingChecks.length||!store.student||!linkOK()||!navigator.sendBeacon)return;
 navigator.sendBeacon(SHEET_URL,new Blob([JSON.stringify(buildPayload('check'))],{type:'text/plain;charset=utf-8'}));
});

/* đăng nhập */
const who=document.getElementById('who'),whoName=document.getElementById('whoName'),whoCls=document.getElementById('whoCls'),whoErr=document.getElementById('whoErr');
function showMe(){document.getElementById('meLbl').textContent=store.student?store.student.name.split(' ').slice(-1)[0]+' · '+store.student.cls:'Học sinh'}
function openWho(){whoName.value=store.student?store.student.name:'';whoCls.value=store.student?store.student.cls:'';whoErr.textContent='';who.hidden=false;setTimeout(()=>whoName.focus(),50)}
document.getElementById('whoOk').addEventListener('click',()=>{
 const name=whoName.value.trim().replace(/\s+/g,' '),cls=whoCls.value.trim().toUpperCase().replace(/\s+/g,'');
 if(name.split(' ').length<2){whoErr.textContent='Con nhập đầy đủ họ và tên nhé.';return}
 if(!cls){whoErr.textContent='Con nhập lớp nhé.';return}
 const old=store.student;
 const same=old&&old.name.toLowerCase()===name.toLowerCase()&&old.cls===cls;
 if(old&&!same){
  if(!confirm('Đổi sang học sinh khác sẽ xoá bài làm đang lưu trên máy này. Tiếp tục?'))return;
  store.done={};store.draft={};store.res={};store.finalRes=null;store.won=0;pendingChecks=[];
  render();show(location.hash.slice(1)||'start');
 }
 store.student=same?old:{name,cls,sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
 save();who.hidden=true;showMe();
 if(!same)sendNow('check');
});
[whoName,whoCls].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('whoOk').click()}));
document.getElementById('meBtn').addEventListener('click',openWho);
document.getElementById('submitBtn').addEventListener('click',()=>{
 if(!store.student){openWho();return}
 const all=S.flatMap(sectionTasks),done=all.filter(i=>store.done[i]).length;
 if(done<all.length&&!confirm(`Con mới hoàn thành ${done}/${all.length} câu. Vẫn nộp bài?`))return;
 sendNow('submit').then(ok=>{if(ok){win();alert('Đã nộp bài! Con vẫn có thể làm tiếp và nộp lại.')}else if(!linkOK())alert('Trang chưa gắn link Google Sheet. Báo thầy nhé.');else alert('Chưa gửi được (mất mạng?). Con thử bấm Nộp bài lại nhé.')});
});

render();
showMe();
if(!store.student)openWho();
if(!sound){document.getElementById('sndBtn').setAttribute('aria-pressed','false');document.getElementById('sndLbl').textContent='Tắt tiếng';document.getElementById('sndWave').style.display='none'}
show(location.hash.slice(1)||'start');
</script>
